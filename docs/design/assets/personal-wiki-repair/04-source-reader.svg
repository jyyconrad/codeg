<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">个人 Wiki · 资料原文阅读 · 设计草图</title><desc id="desc">中等保真界面草图，全部内容为示例数据。采用左侧导航与列表、右侧阅读布局。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#fafafa" stroke="#fafafa"/><rect x="0" y="0" width="208" height="1000" rx="0" fill="#f4f4f5" stroke="#e4e4e7"/><text x="28" y="48" font-size="24" fill="#202023" font-weight="650" text-anchor="start">Codeg</text><text x="28" y="106" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">工作台</text><text x="44" y="150" font-size="16" fill="#202023" font-weight="400" text-anchor="start">对话</text><text x="44" y="200" font-size="16" fill="#202023" font-weight="400" text-anchor="start">项目</text><rect x="16" y="221" width="176" height="42" rx="7" fill="white" stroke="#e4e4e7"/><text x="44" y="250" font-size="16" fill="#202023" font-weight="550" text-anchor="start">个人 Wiki</text><path d="M24 898h160" stroke="#e4e4e7"/><text x="28" y="936" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">本地工作区</text><rect x="208" y="0" width="1232" height="164" rx="0" fill="white" stroke="#e4e4e7"/><text x="240" y="49" font-size="20" fill="#202023" font-weight="600" text-anchor="start">个人 Wiki</text><rect x="1134" y="22" width="136" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1202.0" y="48.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">＋ 添加资料</text><rect x="1282" y="22" width="110" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1337.0" y="48.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">设置</text><text x="248" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">概览</text><text x="328" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">工作</text><text x="408" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">能力</text><text x="488" y="124" font-size="16" fill="#202023" font-weight="600" text-anchor="start">资料</text><rect x="480" y="146" width="64" height="3" rx="1" fill="#202023" stroke="#202023"/><text x="568" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">处理记录</text><text x="240" y="978" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">设计草图 · 示例数据</text><text x="1392" y="978" font-size="14" fill="#71717a" font-weight="400" text-anchor="end">资料原文阅读</text><text x="240" y="220" font-size="26" fill="#202023" font-weight="650" text-anchor="start">资料</text><text x="328" y="219" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">归档材料，随时阅读全文</text><rect x="240" y="250" width="340" height="680" rx="10" fill="white" stroke="#e4e4e7"/><rect x="596" y="250" width="796" height="680" rx="10" fill="white" stroke="#e4e4e7"/><text x="264" y="286" font-size="17" fill="#202023" font-weight="600" text-anchor="start">已保存资料</text><path d="M264 309h292" stroke="#e4e4e7"/><rect x="252" y="325" width="316" height="91" rx="6" fill="#f4f4f5" stroke="#f4f4f5"/><text x="268" y="357" font-size="17" fill="#202023" font-weight="600" text-anchor="start">接口设计参考</text><text x="268" y="387" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">文件 · 今天 09:50</text><text x="268" y="462" font-size="17" fill="#202023" font-weight="600" text-anchor="start">需求讨论摘录</text><text x="268" y="492" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">粘贴文本 · 昨天 15:20</text><text x="268" y="567" font-size="17" fill="#202023" font-weight="600" text-anchor="start">历史对话记录</text><text x="268" y="597" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">历史对话 · 昨天 10:08</text><text x="628" y="294" font-size="26" fill="#202023" font-weight="650" text-anchor="start">接口设计参考</text><rect x="1196" y="268" width="88" height="28" rx="5" fill="#f4f4f5" stroke="#f4f4f5"/><text x="1206" y="287" font-size="14" fill="#52525b" font-weight="400" text-anchor="start">仅归档</text><text x="628" y="333" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">资料已保存，可阅读全文。</text><text x="628" y="361" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">它不会自动进入工作与能力归纳。</text><text x="628" y="408" font-size="16" fill="#202023" font-weight="600" text-anchor="start">提取正文</text><text x="772" y="408" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">资料信息</text><text x="916" y="408" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">关联笔记</text><path d="M628 430h732" stroke="#e4e4e7"/><rect x="628" y="428" width="72" height="3" rx="1" fill="#202023" stroke="#202023"/><text x="628" y="478" font-size="24" fill="#202023" font-weight="600" text-anchor="start">分页接口约定</text><text x="628" y="518" font-size="17" fill="#202023" font-weight="400" text-anchor="start">列表接口使用游标分页。调用方保存本次响应中的下一页游标，</text><text x="628" y="548" font-size="17" fill="#202023" font-weight="400" text-anchor="start">并在下次请求中传入。未返回下一页游标时，表示结果已取完。</text><text x="628" y="602" font-size="20" fill="#202023" font-weight="600" text-anchor="start">请求参数</text><rect x="628" y="624" width="732" height="158" rx="4" fill="white" stroke="#e4e4e7"/><rect x="628" y="624" width="732" height="42" rx="4" fill="#f4f4f5" stroke="#e4e4e7"/><text x="646" y="652" font-size="15" fill="#202023" font-weight="600" text-anchor="start">参数</text><text x="831" y="652" font-size="15" fill="#202023" font-weight="600" text-anchor="start">用途</text><text x="1160" y="652" font-size="15" fill="#202023" font-weight="600" text-anchor="start">是否必填</text><text x="646" y="700" font-size="16" fill="#202023" font-weight="400" text-anchor="start">游标</text><text x="831" y="700" font-size="16" fill="#202023" font-weight="400" text-anchor="start">指定下一页的起点</text><text x="1160" y="700" font-size="16" fill="#202023" font-weight="400" text-anchor="start">否</text><text x="646" y="752" font-size="16" fill="#202023" font-weight="400" text-anchor="start">每页数量</text><text x="831" y="752" font-size="16" fill="#202023" font-weight="400" text-anchor="start">限制本次返回的记录数</text><text x="1160" y="752" font-size="16" fill="#202023" font-weight="400" text-anchor="start">否</text><path d="M628 722h732" stroke="#e4e4e7"/><text x="628" y="832" font-size="17" fill="#202023" font-weight="600" text-anchor="start">关联笔记</text><text x="628" y="866" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">这份资料暂未关联笔记。</text><text x="628" y="902" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">示意：关联笔记为空时的提示</text></g></svg>
