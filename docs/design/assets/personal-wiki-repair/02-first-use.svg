<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">个人 Wiki · 首次使用 · 设计草图</title><desc id="desc">中等保真界面草图，全部内容为示例数据。采用左侧导航与列表、右侧阅读布局。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#fafafa" stroke="#fafafa"/><rect x="0" y="0" width="208" height="1000" rx="0" fill="#f4f4f5" stroke="#e4e4e7"/><text x="28" y="48" font-size="24" fill="#202023" font-weight="650" text-anchor="start">Codeg</text><text x="28" y="106" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">工作台</text><text x="44" y="150" font-size="16" fill="#202023" font-weight="400" text-anchor="start">对话</text><text x="44" y="200" font-size="16" fill="#202023" font-weight="400" text-anchor="start">项目</text><rect x="16" y="221" width="176" height="42" rx="7" fill="white" stroke="#e4e4e7"/><text x="44" y="250" font-size="16" fill="#202023" font-weight="550" text-anchor="start">个人 Wiki</text><path d="M24 898h160" stroke="#e4e4e7"/><text x="28" y="936" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">本地工作区</text><rect x="208" y="0" width="1232" height="164" rx="0" fill="white" stroke="#e4e4e7"/><text x="240" y="49" font-size="20" fill="#202023" font-weight="600" text-anchor="start">个人 Wiki</text><rect x="1134" y="22" width="136" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1202.0" y="48.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">＋ 添加资料</text><rect x="1282" y="22" width="110" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1337.0" y="48.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">设置</text><text x="248" y="124" font-size="16" fill="#202023" font-weight="600" text-anchor="start">概览</text><rect x="240" y="146" width="64" height="3" rx="1" fill="#202023" stroke="#202023"/><text x="328" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">工作</text><text x="408" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">能力</text><text x="488" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">资料</text><text x="568" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">处理记录</text><text x="240" y="978" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">设计草图 · 示例数据</text><text x="1392" y="978" font-size="14" fill="#71717a" font-weight="400" text-anchor="end">首次使用</text><rect x="240" y="198" width="76" height="28" rx="5" fill="#f4f4f5" stroke="#f4f4f5"/><text x="250" y="217" font-size="14" fill="#52525b" font-weight="400" text-anchor="start">尚未启用</text><rect x="240" y="246" width="1152" height="640" rx="10" fill="white" stroke="#e4e4e7"/><text x="816" y="321" font-size="30" fill="#202023" font-weight="650" text-anchor="middle">把工作记录变成可回看的笔记</text><text x="816" y="363" font-size="18" fill="#71717a" font-weight="400" text-anchor="middle">会话结束后自动记录工作；你也可以添加资料，随时阅读原文。</text><rect x="628" y="406" width="184" height="46" rx="7" fill="#202023" stroke="#202023"/><text x="720.0" y="435.0" font-size="16" fill="white" font-weight="500" text-anchor="middle">启用个人 Wiki</text><rect x="828" y="406" width="180" height="46" rx="7" fill="white" stroke="#e4e4e7"/><text x="918.0" y="435.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">先了解如何使用</text><rect x="288" y="510" width="320" height="230" rx="8" fill="#fafafa" stroke="#e4e4e7"/><rect x="312" y="534" width="32" height="28" rx="5" fill="#f4f4f5" stroke="#f4f4f5"/><text x="322" y="553" font-size="14" fill="#52525b" font-weight="400" text-anchor="start">1</text><text x="312" y="602" font-size="21" fill="#202023" font-weight="600" text-anchor="start">记录工作</text><text x="312" y="642" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">保存每轮工作的要点，</text><text x="312" y="670" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">会话完成后汇总过程与结果。</text><rect x="656" y="510" width="320" height="230" rx="8" fill="#fafafa" stroke="#e4e4e7"/><rect x="680" y="534" width="32" height="28" rx="5" fill="#f4f4f5" stroke="#f4f4f5"/><text x="690" y="553" font-size="14" fill="#52525b" font-weight="400" text-anchor="start">2</text><text x="680" y="602" font-size="21" fill="#202023" font-weight="600" text-anchor="start">归纳经验</text><text x="680" y="642" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">从工作笔记中归纳方法，</text><text x="680" y="670" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">积累以后能用上的经验。</text><rect x="1024" y="510" width="320" height="230" rx="8" fill="#fafafa" stroke="#e4e4e7"/><rect x="1048" y="534" width="32" height="28" rx="5" fill="#f4f4f5" stroke="#f4f4f5"/><text x="1058" y="553" font-size="14" fill="#52525b" font-weight="400" text-anchor="start">3</text><text x="1048" y="602" font-size="21" fill="#202023" font-weight="600" text-anchor="start">保存资料</text><text x="1048" y="642" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">添加文件或已有记录，</text><text x="1048" y="670" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">在资料页直接阅读原文。</text><text x="816" y="798" font-size="16" fill="#71717a" font-weight="400" text-anchor="middle">添加的资料只归档供阅读，不会自动生成工作或能力笔记。</text><text x="816" y="841" font-size="15" fill="#71717a" font-weight="400" text-anchor="middle">启用后可在设置中调整自动归纳时间和模型。</text></g></svg>
