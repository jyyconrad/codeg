<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">个人 Wiki · 基础设置与高级折叠 · 设计草图</title><desc id="desc">中等保真界面草图，全部内容为示例数据。采用左侧导航与列表、右侧阅读布局。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Hiragino Sans GB, sans-serif"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#fafafa" stroke="#fafafa"/><rect x="0" y="0" width="208" height="1000" rx="0" fill="#f4f4f5" stroke="#e4e4e7"/><text x="28" y="48" font-size="24" fill="#202023" font-weight="650" text-anchor="start">Codeg</text><text x="28" y="106" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">工作台</text><text x="44" y="150" font-size="16" fill="#202023" font-weight="400" text-anchor="start">对话</text><text x="44" y="200" font-size="16" fill="#202023" font-weight="400" text-anchor="start">项目</text><rect x="16" y="221" width="176" height="42" rx="7" fill="white" stroke="#e4e4e7"/><text x="44" y="250" font-size="16" fill="#202023" font-weight="550" text-anchor="start">个人 Wiki</text><path d="M24 898h160" stroke="#e4e4e7"/><text x="28" y="936" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">本地工作区</text><rect x="208" y="0" width="1232" height="164" rx="0" fill="white" stroke="#e4e4e7"/><text x="240" y="49" font-size="20" fill="#202023" font-weight="600" text-anchor="start">个人 Wiki</text><rect x="1134" y="22" width="136" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1202.0" y="48.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">＋ 添加资料</text><rect x="1282" y="22" width="110" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1337.0" y="48.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">设置</text><text x="248" y="124" font-size="16" fill="#202023" font-weight="600" text-anchor="start">概览</text><rect x="240" y="146" width="64" height="3" rx="1" fill="#202023" stroke="#202023"/><text x="328" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">工作</text><text x="408" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">能力</text><text x="488" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">资料</text><text x="568" y="124" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">处理记录</text><text x="240" y="978" font-size="14" fill="#71717a" font-weight="400" text-anchor="start">设计草图 · 示例数据</text><text x="1392" y="978" font-size="14" fill="#71717a" font-weight="400" text-anchor="end">基础设置与高级折叠</text><text x="240" y="220" font-size="26" fill="#202023" font-weight="650" text-anchor="start">个人 Wiki 设置</text><text x="240" y="253" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">决定如何记录工作、何时归纳，以及使用哪个模型。</text><rect x="240" y="282" width="1152" height="476" rx="10" fill="white" stroke="#e4e4e7"/><text x="272" y="328" font-size="19" fill="#202023" font-weight="600" text-anchor="start">启用个人 Wiki</text><rect x="1318" y="304" width="42" height="24" rx="12" fill="#202023" stroke="#202023"/><circle cx="1348" cy="316" r="8" fill="white"/><text x="272" y="360" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">启用后记录新工作，并可添加资料供阅读。</text><path d="M272 390h1088" stroke="#e4e4e7"/><text x="272" y="430" font-size="19" fill="#202023" font-weight="600" text-anchor="start">自动归纳</text><rect x="1318" y="406" width="42" height="24" rx="12" fill="#202023" stroke="#202023"/><circle cx="1348" cy="418" r="8" fill="white"/><text x="272" y="463" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">定时把新的工作笔记归纳为方法与能力笔记。</text><text x="272" y="518" font-size="16" fill="#202023" font-weight="500" text-anchor="start">整理时间</text><rect x="1016" y="488" width="344" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1188.0" y="514.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">每天 03:00（Asia/Shanghai）</text><path d="M1338 508m-4 -2 4 4 4 -4" stroke="#71717a" stroke-width="1.7" fill="none"/><path d="M272 558h1088" stroke="#e4e4e7"/><text x="272" y="601" font-size="19" fill="#202023" font-weight="600" text-anchor="start">用于整理的模型</text><rect x="1016" y="575" width="344" height="40" rx="7" fill="white" stroke="#e4e4e7"/><text x="1188.0" y="601.0" font-size="16" fill="#202023" font-weight="500" text-anchor="middle">示例模型 A</text><path d="M1338 595m-4 -2 4 4 4 -4" stroke="#71717a" stroke-width="1.7" fill="none"/><text x="272" y="639" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">启用时复制当前 Codeg Agent 的模型选择，此后独立保存。</text><text x="272" y="675" font-size="16" fill="#71717a" font-weight="400" text-anchor="start">记录工作、对话总结与归纳默认使用同一模型。</text><text x="272" y="714" font-size="15" fill="#71717a" font-weight="400" text-anchor="start">需要分别配置时，可展开高级设置。</text><rect x="240" y="778" width="1152" height="70" rx="10" fill="white" stroke="#e4e4e7"/><path d="M271 812m-2 -4 4 4 -4 4" stroke="#71717a" stroke-width="1.7" fill="none"/><text x="296" y="820" font-size="17" fill="#202023" font-weight="500" text-anchor="start">高级设置：分阶段模型、提示词、保存位置、排除范围</text><rect x="1256" y="878" width="136" height="40" rx="7" fill="#202023" stroke="#202023"/><text x="1324.0" y="904.0" font-size="16" fill="white" font-weight="500" text-anchor="middle">保存设置</text></g></svg>
