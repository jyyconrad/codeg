[package]
edition = "2024"
name = "rig-agent"
version = "0.42.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rig's classic agent runtime."
readme = "README.md"
license = "MIT"
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
audio = ["rig-core/audio"]
default = ["derive"]
derive = [
    "dep:rig-derive",
    "rig-core/derive",
]
discord-bot = ["dep:serenity"]
image = ["rig-core/image"]
rmcp = ["dep:rmcp"]
test-utils = ["rig-core/test-utils"]

[lib]
name = "rig_agent"
path = "src/lib.rs"
doctest = true

[[example]]
name = "raw_response_hook"
path = "examples/raw_response_hook.rs"

[[example]]
name = "retry_on_truncation"
path = "examples/retry_on_truncation.rs"

[[example]]
name = "runtime_model_routing"
path = "examples/runtime_model_routing.rs"

[[test]]
name = "runtime_model_swapping"
path = "tests/runtime_model_swapping.rs"

[dependencies.async-stream]
version = "0.3"

[dependencies.fastrand]
version = "2"

[dependencies.futures]
version = "0.3"

[dependencies.http]
version = "1"

[dependencies.indexmap]
version = "2"

[dependencies.rig-core]
version = "0.42.0"
default-features = false

[dependencies.rig-derive]
version = "0.42.0"
optional = true

[dependencies.schemars]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.54"

[dependencies.serenity]
version = "0.12"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
